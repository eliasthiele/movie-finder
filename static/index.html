
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Movie Finder</h1>

    <form id="searchForm">
        <!--Genre-->
        <div class="genre-section">
            <div class="genre-input-row">
                <label for="genres">Genres</label>
                <input
                    type="text"
                    id="genres"
                    placeholder="Comedy"
                >

                <button type="button" id="addGenre">Add</button>
            </div>

            <div id="selectedGenres" class="selected-genres"></div>
        </div>

        <br>

        <!--Country-->
        <div>
            <label for="origin">Origin country</label>
            <input
                type="text"
                id="origin"
                placeholder="United Kingdom"
            >
        </div>

        <br>

        <!--Director-->
        <div>
            <label for="director">Director</label>
            <input
                type="text"
                id="director"
                placeholder="Mike Leigh"
            >
        </div>

        <br>

        <!--Actor-->
        <div>
            <label for="actor">Actor</label>
            <input
                type="text"
                id="actor"
                placeholder="Susumu Terajima"
            >
        </div>

        <br> 

        <!--Year-->
        <div>
            <label for="year">Release year</label>
            <input
                type="number"
                id="year"
                placeholder="1970"
            >
        </div>

        <br> 

         <!--Min runtime-->
        <div>
            <label for="minRuntime">Min runtime (minutes)</label>
            <input
                type="number"
                id="minRuntime"
                placeholder="15"
            >
        </div>

        <br>

        <!--Max runtime-->
        <div>
            <label for="maxRuntime">Max runtime (minutes)</label>
            <input
                type="number"
                id="maxRuntime"
                placeholder="95"
            >
        </div>

        <br> 

        <button type="submit">Search</button>
    </form>

    <h2>Results</h2>
    <div id="results">
        <p>No results yet.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
